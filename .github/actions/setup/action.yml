name: Setup
description: Node and pnpm from mise.toml, cached pnpm store and Next.js build cache, `pnpm install`.

runs:
  using: composite
  steps:
    - name: Install Node and pnpm (mise.toml)
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        # Skip mise releases younger than a week (supply-chain cooldown).
        minimum_release_age: 7d
        # Not the default `mise-v1`: caches saved under it by mise-action v4 have
        # no record of their mise version, and v5 reinstalls such a mise after
        # every mise release. Same prefix as in prototype-pages.yml.
        cache_key_prefix: mise-v2

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Cache Next.js build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
        restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
