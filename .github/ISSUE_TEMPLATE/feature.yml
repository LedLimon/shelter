name: Задача / фича
description: Новая функциональность или доработка
labels: ["enhancement"]
body:
  - type: textarea
    id: why
    attributes:
      label: Зачем
      description: Какую проблему решаем и для кого (1–3 предложения).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что сделать
      description: Конкретные шаги, компоненты, маршруты, модели.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Проверяемые результаты, включая тесты.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Зависимости
      placeholder: "- Блокируется: #N — название"
  - type: textarea
    id: docs
    attributes:
      label: Документация
      placeholder: "- docs/product.md#..."
