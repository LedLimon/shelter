name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes its previous run. Every other run (main,
  # manual) gets a group of its own, so no commit on main is left unchecked.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Throwaway values for the env check on server start (src/lib/env/schema.ts):
  # the e2e job starts the standalone server, `next build` needs none of them.
  # The database is the e2e job's Postgres service; integration tests start
  # their own (Testcontainers). Not secrets: real ones never go into the
  # repository (AGENTS.md).
  DATABASE_URL: postgresql://shelter:shelter@localhost:5432/shelter_test
  BETTER_AUTH_SECRET: ci-only-placeholder-not-a-real-secret
  SEED_OWNER_EMAIL: owner@shelter.localhost
  SEED_OWNER_PASSWORD: ci-owner-password
  SEED_OWNER_TOTP_SECRET: ci-owner-totp-secret
  APP_URL: http://127.0.0.1:3100
  SHELTER_TIMEZONE: Europe/Moscow
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: ru-central1
  S3_BUCKET: shelter
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci
  S3_FORCE_PATH_STYLE: "true"
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_FROM: "Приют <no-reply@shelter.localhost>"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup

      # Every check runs even if an earlier one failed, so one run reports all problems.
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm format:check

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint

      # Unit and integration tests; the latter start Postgres in Docker
      # (Testcontainers), the same way as locally.
      - name: Test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Sign-in scenarios need a database (DATABASE_URL above); same image as
    # docker-compose.yml.
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: shelter
          POSTGRES_PASSWORD: shelter
          POSTGRES_DB: shelter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelter -d shelter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keep the suffix in sync with the browsers installed below.
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      # System packages are not cached; a cached browser is not downloaded again.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # The migrations as deployments apply them, then the seed as the first
      # deployment runs it; e2e/global-setup.ts adds the test users.
      - name: Prepare database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

      # The standalone server does not serve .next/static and public by itself.
      - name: Prepare standalone server
        run: |
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
